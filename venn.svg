    <polygon points="80,246 262,224 136,108" fill="#2f7684" fill-opacity=".20" stroke="#2f7684" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="104" cy="104" r="76" fill="#66539a" fill-opacity=".22" stroke="#66539a" stroke-width="1.8"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#2c3f72" text-anchor="middle">
